global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - "saga_alerts.yml"

scrape_configs:
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8083']
    metrics_path: '/actuator/prometheus'

  - job_name: 'shipping-service'
    static_configs:
      - targets: ['shipping-service:8084']
    metrics_path: '/actuator/prometheus'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9997']
